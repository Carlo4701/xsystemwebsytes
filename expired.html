<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XSYSTEM | OTURUM DOLDU</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--p:#9B30FF;--p2:#c084fc;--bg:#04010f;--text:#ede9ff;--muted:#6b5a8e;--red:#ff4466;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Rajdhani',sans-serif;min-height:100vh;color:var(--text);
  display:flex;align-items:center;justify-content:center;}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(155,48,255,0.05)1px,transparent 1px),linear-gradient(90deg,rgba(155,48,255,0.05)1px,transparent 1px);
  background-size:44px 44px;animation:gridScroll 25s linear infinite;}
@keyframes gridScroll{to{background-position:0 44px;}}
.center{position:relative;z-index:1;text-align:center;padding:30px;}
.ico{font-size:60px;margin-bottom:20px;filter:grayscale(0.3);}
.title{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;letter-spacing:5px;color:var(--red);margin-bottom:10px;}
.sub{font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:28px;}
.back-btn{display:inline-block;padding:13px 28px;border-radius:12px;
  background:rgba(155,48,255,0.1);border:1px solid rgba(155,48,255,0.3);
  font-family:'Orbitron',monospace;font-size:11px;letter-spacing:3px;
  color:var(--p2);text-decoration:none;transition:all 0.2s;}
.back-btn:hover{background:rgba(155,48,255,0.2);border-color:var(--p2);}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="center">
  <div class="ico">⌛</div>
  <div class="title">OTURUM SÜRESİ DOLDU</div>
  <div class="sub">Bu link artık geçerli değil. 15 dakikalık süre sona erdi.</div>
  <a href="/" class="back-btn">+ YENİ LİNK OLUŞTUR</a>
</div>
</body>
</html>
